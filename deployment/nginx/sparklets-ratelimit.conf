# Rate limits used by the sparklets.im /api location only.
map $request_method $sparklets_write_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $binary_remote_addr  zone=sparklets_api:10m   rate=10r/s;
limit_req_zone $sparklets_write_key zone=sparklets_write:10m rate=10r/m;
