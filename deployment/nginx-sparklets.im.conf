# Live nginx config for sparklets.im (mirrors /etc/nginx/sites-available/sparklets.im).
# Requires deployment/sparklets-security-headers.conf at /etc/nginx/snippets/.
# First-time setup: comment out the 443 server block until certbot has issued the certificate.

# Initial HTTP configuration for certbot SSL setup
server {
    listen 80;
    listen [::]:80;
    server_name sparklets.im www.sparklets.im;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (after SSL is setup)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS configuration (uncomment after obtaining SSL certificate)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sparklets.im www.sparklets.im;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/sparklets.im/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sparklets.im/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Increase max upload size for sparklet images
    client_max_body_size 10M;

    # FastAPI backend API endpoints
    location /api {
        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static content files (images uploaded to sparklets)
    # Must come before regex patterns to take precedence
    location /contents {
        alias /var/www/sparklets.im/backend/contents;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include snippets/sparklets-security-headers.conf;
    }

    # Vue frontend static files
    # index.html must not be cached, or browsers keep requesting old asset hashes
    # sparklet links (/s/<id>) get s.html: same app, generic "a sparklet is waiting" preview
    location ^~ /s/ {
        root /var/www/sparklets.im/frontend/dist;
        try_files /s.html =404;
        add_header Cache-Control "no-cache";
        include snippets/sparklets-security-headers.conf;
    }

    location = /index.html {
        root /var/www/sparklets.im/frontend/dist;
        add_header Cache-Control "no-cache";
        include snippets/sparklets-security-headers.conf;
    }

    location / {
        root /var/www/sparklets.im/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
        include snippets/sparklets-security-headers.conf;
    }

    # Frontend assets with longer cache (excludes /contents path)
    location ~ ^/(?!contents/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/sparklets.im/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/sparklets-security-headers.conf;
    }
}
