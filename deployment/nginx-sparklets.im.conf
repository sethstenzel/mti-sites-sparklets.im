# Initial HTTP configuration for certbot SSL setup
server {
    listen 80;
    listen [::]:80;
    server_name sparklets.im www.sparklets.im;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (after SSL is setup)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

