<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sparklets.im</title>
    <meta name="description" content="Make a little photo note and share it with a link or a QR code.">
    <meta name="theme-color" content="#fbf9fa">
    <script>
      // Apply the saved site theme before first paint (no flash of the wrong colors).
      (function () {
        var themes = { neutral: '#fbf9fa', blush: '#fbf7fb', slate: '#0e1318' };
        var id = null;
        try { id = localStorage.getItem('sparklets.siteTheme'); } catch (e) {}
        if (!themes[id]) id = 'neutral';
        document.documentElement.setAttribute('data-theme', id);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themes[id]);
      })();
    </script>
    <!--
      Link previews (iMessage, WhatsApp, Facebook, X, Slack…). Crawlers don't run JS, so
      these are static and deliberately generic: they never reveal who a sparklet is from
      or what it says.
    -->
    <meta property="og:site_name" content="Sparklets">
    <meta property="og:type" content="website">
    <meta property="og:title" content="You’ve got a sparklet ✨">
    <meta property="og:description" content="A special message is waiting for you. Tap to open it.">
    <meta property="og:image" content="https://sparklets.im/og-image.jpg">
    <meta property="og:image:secure_url" content="https://sparklets.im/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Two polaroid-style photo notes with the words: You’ve got a sparklet. A special message is waiting for you.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="You’ve got a sparklet ✨">
    <meta name="twitter:description" content="A special message is waiting for you. Tap to open it.">
    <meta name="twitter:image" content="https://sparklets.im/og-image.jpg">
    <meta name="twitter:image:alt" content="Two polaroid-style photo notes with the words: You’ve got a sparklet. A special message is waiting for you.">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&family=Fredoka:wght@500;600&family=Kalam:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@1,500;1,700&family=Special+Elite&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
